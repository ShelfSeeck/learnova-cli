name: GitLab mirror smoke

# 对真实公开镜像仓的可选冒烟检查，独立于 PR 检查。
# fixture 模拟不了真实 GitLab 的端点行为——archive 的 path= 过滤、
# 下载上限等回归只能靠这条链路暴露。
on:
  schedule:
    - cron: "17 3 * * *" # 每日 UTC 03:17（北京时间 11:17）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: vars.LEARNOVA_RUN_MIRROR_SMOKE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEARNOVA_RUN_MIRROR_SMOKE: '1'
      LEARNOVA_TEST_MIRROR_URL: ${{ vars.LEARNOVA_TEST_MIRROR_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv python install 3.12

      - name: Isolated search, pinned install, list and uninstall
        run: uv run --no-project --python 3.12 python tests/mirror_smoke.py
