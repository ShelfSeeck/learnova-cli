stages:
  - test
  - integration

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHONIOENCODING: "utf-8"
  LEARNOVA_CI_IMAGE: "docker.nju.edu.cn/library/python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337"

.versions:
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]

linux:
  extends: .versions
  stage: test
  image: "$LEARNOVA_CI_IMAGE"
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git curl ca-certificates
    - curl --fail --silent --show-error --location https://astral.sh/uv/0.13.6/install.sh --output /tmp/install-uv.sh
    - UV_UNMANAGED_INSTALL=/tmp/uv sh /tmp/install-uv.sh
    - export PATH="/tmp/uv:$PATH"
    - uv python install "$PYTHON_VERSION"
  script:
    - uv run --no-project --python "$PYTHON_VERSION" python tests/run_ci.py --expected-platform Linux

# Native jobs are enabled only when the operator provides a matching runner tag.
windows:
  extends: .versions
  stage: test
  tags:
    - "$LEARNOVA_WINDOWS_RUNNER_TAG"
  rules:
    - if: '$LEARNOVA_WINDOWS_RUNNER_TAG'
  script:
    - uv python install $env:PYTHON_VERSION
    - uv run --no-project --python $env:PYTHON_VERSION python tests/run_ci.py --expected-platform Windows --require-powershell

macos:
  extends: .versions
  stage: test
  tags:
    - "$LEARNOVA_MACOS_RUNNER_TAG"
  rules:
    - if: '$LEARNOVA_MACOS_RUNNER_TAG'
  script:
    - uv python install "$PYTHON_VERSION"
    - uv run --no-project --python "$PYTHON_VERSION" python tests/run_ci.py --expected-platform Darwin

backend-integration:
  stage: integration
  image: "$LEARNOVA_CI_IMAGE"
  allow_failure: true
  rules:
    - if: '$LEARNOVA_RUN_BACKEND_TESTS == "1" && $LEARNOVA_TEST_BACKEND_URL'
  script:
    - python tests/t2_backend_flow.py

mirror-smoke:
  stage: integration
  image: "$LEARNOVA_CI_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LEARNOVA_RUN_MIRROR_SMOKE == "1"'
  script:
    - python tests/mirror_smoke.py
